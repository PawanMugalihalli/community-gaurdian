version: '3.8'

services:
  db:
    image: postgres:14
    container_name: community_guardian_db
    environment:
      POSTGRES_DB: community_guardian
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: guardian_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
