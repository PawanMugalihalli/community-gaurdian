services:
  db:
    image: postgres:14
    container_name: community_guardian_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Use 5433 on the host so Postico/your Mac don't hit Homebrew Postgres on 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guardian_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: community_guardian_backend
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BATCH_CHUNK_SIZE=${BATCH_CHUNK_SIZE}
      - BATCH_INTERVAL_MINUTES=${BATCH_INTERVAL_MINUTES}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - guardian_network
    volumes:
      - .:/app

networks:
  guardian_network:
    driver: bridge

volumes:
  postgres_data:




